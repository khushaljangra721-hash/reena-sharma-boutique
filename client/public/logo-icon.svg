<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8C7"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8243"/>
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1830"/>
      <stop offset="100%" stop-color="#3A070E"/>
    </linearGradient>
  </defs>
  
  <!-- Outer luxury circle -->
  <circle cx="50" cy="50" r="46" fill="url(#burgundyGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2, 2"/>
  
  <!-- Stylized Lotus / Fashion crown motif -->
  <path d="M50 18 C53 28 62 34 68 40 C60 42 55 36 50 30 C45 36 40 42 32 40 C38 34 47 28 50 18 Z" fill="url(#goldGrad)"/>
  <path d="M50 30 C58 36 68 45 74 56 C64 54 58 48 50 42 C42 48 36 54 26 56 C32 45 42 36 50 30 Z" fill="url(#goldGrad)" opacity="0.85"/>
  
  <!-- Stylized RS Monogram -->
  <text x="50" y="78" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">RS</text>
  
  <!-- Decorative diamond dots -->
  <circle cx="50" cy="85" r="1.5" fill="url(#goldGrad)"/>
  <circle cx="44" cy="85" r="1" fill="url(#goldGrad)"/>
  <circle cx="56" cy="85" r="1" fill="url(#goldGrad)"/>
</svg>
